{% extends "includes/master.html" %}

{% block title %}Register for IChatBox{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px); background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent 40%), radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.05), transparent 40%); padding: 40px 0;">
    <div class="col-lg-5 col-md-7 col-sm-9 px-4" style="max-width: 480px;">
        <div class="card border-0 shadow-lg" style="border-radius: 18px; overflow: hidden; background: #ffffff;">
            <!-- Header -->
            <div class="text-center pt-5 pb-3 px-4 bg-white">
                <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 54px; height: 54px; background: #eef2ff; border-radius: 14px;">
                    <i class="fa fa-user-plus" style="font-size: 24px; color: #4f46e5;"></i>
                </div>
                <h4 class="font-weight-bold text-dark mb-1" style="letter-spacing: -0.5px;">Create Your Account</h4>
                <p class="text-muted small mb-0">Get your license key and start integrating live chatbox today</p>
            </div>

            <!-- Custom styling for dynamic Django form fields -->
            <style>
                form p {
                    margin-bottom: 16px;
                    display: flex;
                    flex-direction: column;
                }
                form label {
                    font-size: 11px;
                    font-weight: 700;
                    text-transform: uppercase;
                    color: #64748b;
                    margin-bottom: 6px;
                    letter-spacing: 0.5px;
                }
                form input {
                    display: block;
                    width: 100%;
                    padding: 10px 16px;
                    font-size: 14px;
                    font-weight: 400;
                    line-height: 1.5;
                    color: #1e293b;
                    background-color: #f8fafc;
                    border: 1px solid #e2e8f0;
                    border-radius: 10px;
                    transition: all 0.2s ease;
                    outline: none !important;
                }
                form input:focus {
                    border-color: #6366f1;
                    background-color: #ffffff;
                    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
                }
                form .errorlist {
                    list-style: none;
                    padding: 8px 12px;
                    margin: 0 0 14px 0;
                    color: #991b1b;
                    background-color: #fef2f2;
                    font-size: 12px;
                    font-weight: 500;
                    border-radius: 8px;
                }
                form .helptext {
                    font-size: 11px;
                    color: #94a3b8;
                    margin-top: 4px;
                    font-weight: 400;
                }
            </style>

            <div class="card-body px-4 py-3">
                <form method="POST" novalidate>
                    {% csrf_token %}

                    {{ form.as_p }}

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-block py-2 mt-4" style="border-radius: 10px; font-weight: 600; font-size: 14px;">
                        Register Account <i class="fa fa-arrow-right ml-1"></i>
                    </button>
                </form>
            </div>

            <!-- Footer Link -->
            <div class="card-footer border-0 text-center bg-white pt-2 pb-4">
                <span class="text-muted small">Already have an account?</span>
                <a href="{% url 'login' %}" class="small font-weight-bold text-primary ml-1" style="text-decoration: none;">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
