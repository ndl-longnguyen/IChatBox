services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ichatbox}
      POSTGRES_USER: ${POSTGRES_USER:-ichatbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ichatbox}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8002:8002"
    environment:
      SECRET_KEY: ${SECRET_KEY:-SECRET_KEY}
      DEBUG: ${DEBUG:-True}
      PORT: 8002
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-ichatbox}
      POSTGRES_USER: ${POSTGRES_USER:-ichatbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ichatbox}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
